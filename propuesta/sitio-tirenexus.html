:root[data-theme="dark"]{

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.1}
p{margin:0}
img,svg{max-width:100%}
a{color:var(--orange-700);text-underline-offset:2px}
button{font:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.wrap{width:min(100% - 2rem,var(--wrap));margin-inline:auto}
.mono{font-family:var(--mono)}
.tab{font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
.wm{font-family:var(--display);font-weight:900;font-style:italic;letter-spacing:-.03em}
.hide{display:none!important}

/* demo ribbon */
.demo{background:var(--carbon);color:#C9C3BB;font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;padding:6px 0;border-bottom:1px solid #2a2724}
.demo .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.demo b{color:var(--orange)}
.demo .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.demo button{background:transparent;border:1px solid #3a3633;color:#C9C3BB;border-radius:999px;padding:3px 10px;font-family:var(--mono);font-size:.66rem;cursor:pointer;letter-spacing:.08em}
.demo button[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff}

/* header */
header.site{background:var(--header);color:#fff;position:sticky;top:0;z-index:50}
header.site .bar{display:flex;align-items:center;gap:18px;min-height:60px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:900;font-style:italic;font-size:22px;letter-spacing:-.03em;text-decoration:none;color:#fff;white-space:nowrap}
.logo .o{color:var(--orange)}
.logo small{display:block;font-family:var(--body);font-style:normal;font-weight:600;font-size:7.5px;letter-spacing:.24em;color:#B8B2AA;margin-top:-2px}
nav.main{display:flex;gap:16px;flex-wrap:wrap}
nav.main a{color:#C9C3BB;text-decoration:none;font-size:.86rem;padding:4px 0;border-bottom:2px solid transparent}
nav.main a:hover{color:#fff}
nav.main a.on{color:#fff;border-bottom-color:var(--orange)}
.hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.phone{font-family:var(--mono);font-size:.78rem;color:#C9C3BB;text-decoration:none;white-space:nowrap}

/* buttons */
.btn{background:var(--orange);color:#fff;border:0;border-radius:var(--r);padding:11px 18px;font-weight:700;font-size:.84rem;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:44px}
.btn:hover{background:var(--orange-700);color:#fff}
.btn.sm{padding:7px 12px;min-height:36px;font-size:.78rem}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.ghost.light{color:#fff;border-color:#fff}
.btn.ghost:hover{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.quiet{background:var(--surface-2);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* hero + search */
.hero{background:linear-gradient(var(--surface),var(--bg));border-bottom:1px solid var(--line);padding:38px 0 30px}
.hero h1{font-family:var(--display);font-weight:900;font-style:italic;font-size:clamp(1.9rem,5vw,3.25rem);letter-spacing:-.035em;max-width:16ch}
.hero .sub{margin-top:12px;color:var(--ink-2);max-width:60ch}
.searchbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);margin-top:22px;overflow:hidden}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--ink-3);font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;padding:12px 16px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--orange)}
.searchform{padding:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:5px;flex:1 1 168px;min-width:0}
.field label{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.field input,.field select{font:inherit;font-family:var(--mono);font-size:.86rem;padding:11px 12px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);color:var(--ink);min-height:44px;width:100%}
.searchform .btn{flex:0 0 auto}
.hint{padding:0 16px 14px;font-size:.78rem;color:var(--ink-3)}
.hint b{color:var(--ink-2);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 16px}
.chip{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-family:var(--mono);font-size:.72rem;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--orange);color:var(--orange-700)}

/* generic layout */
main{min-height:60vh}
section.band{padding:40px 0}
section.band.alt{background:var(--surface);border-block:1px solid var(--line)}
.sec-title{font-family:var(--display);font-weight:800;font-size:clamp(1.35rem,2.8vw,1.9rem);letter-spacing:-.02em}
.sec-lede{color:var(--ink-2);max-width:64ch;margin-top:8px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.card h3{font-size:1.02rem;margin-bottom:6px}
.card p{font-size:.9rem;color:var(--ink-2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-style:italic;font-weight:900;font-size:1.7rem;letter-spacing:-.02em;line-height:1.05}
.stat span{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.stat .live{color:var(--ok);font-size:.58rem}

.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--orange-050)}
th{font-family:var(--mono);font-size:.63rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600;white-space:nowrap}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:3px 10px;font-size:.72rem;font-weight:600;font-family:var(--mono);white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)}
.gatecell{font-family:var(--mono);font-size:.78rem;color:var(--orange-700);cursor:pointer;background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px}

/* gate / notices */
.gate{background:var(--carbon);color:#fff;border-radius:var(--r-lg);padding:16px 18px;display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:16px}
.gate b{font-family:var(--display);font-style:italic;font-weight:900;font-size:1.15rem}
.gate .mono{color:#B8B2AA;font-size:.76rem}
.notice{background:var(--orange-050);border-left:3px solid var(--orange);border-radius:var(--r);padding:11px 14px;font-size:.86rem;color:var(--ink)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.filters select{font:inherit;font-family:var(--mono);font-size:.78rem;padding:8px 10px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);color:var(--ink);min-height:38px}
.crumb{font-family:var(--mono);font-size:.72rem;color:var(--ink-3);padding:16px 0 0}
.crumb a{color:var(--ink-3);text-decoration:none}
.crumb a:hover{color:var(--orange-700)}
.pagehead{padding:10px 0 18px}
.pagehead h1{font-family:var(--display);font-weight:900;font-style:italic;font-size:clamp(1.6rem,4vw,2.5rem);letter-spacing:-.03em}
.pagehead .answer{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--orange);border-radius:var(--r);padding:13px 16px;max-width:76ch;font-size:.94rem}

/* forms */
.form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;max-width:560px}
.form .field{flex:1 1 100%;margin-bottom:12px}
.form .err{color:var(--bad);font-size:.76rem;font-family:var(--mono);margin-top:4px}
.upload{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:14px;text-align:center;font-size:.84rem;color:var(--ink-2);cursor:pointer}
.upload.done{border-style:solid;border-color:var(--ok);color:var(--ok)}
.steps{display:flex;gap:0;margin-bottom:18px;flex-wrap:wrap}
.steps div{flex:1 1 90px;font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);border-top:3px solid var(--line);padding-top:8px;margin-right:8px}
.steps div.on{color:var(--ink);border-top-color:var(--orange)}

/* portal */
.portal-top{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.acct{font-family:var(--mono);font-size:.76rem;color:var(--ink-2)}
.acct b{color:var(--ink)}
.cartbar{position:sticky;bottom:0;background:var(--carbon);color:#fff;border-radius:var(--r-lg);padding:12px 16px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:18px;box-shadow:var(--shadow);z-index:20}
.cartbar .mono{color:#B8B2AA;font-size:.78rem}

/* footer */
footer.site{background:var(--carbon);color:#B8B2AA;margin-top:48px;padding:38px 0 60px;font-size:.86rem}
footer.site a{color:#C9C3BB;text-decoration:none;display:block;padding:3px 0}
footer.site a:hover{color:var(--orange)}
footer.site h4{color:#fff;font-family:var(--mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;margin-bottom:8px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:22px}
.fbot{border-top:1px solid #241f1c;margin-top:26px;padding-top:16px;font-family:var(--mono);font-size:.7rem;color:#6f6862;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.faq dt{font-weight:700;margin-top:14px}
.faq dd{margin:4px 0 0;color:var(--ink-2);font-size:.92rem}
@media(max-width:760px){
  nav.main{order:3;width:100%;gap:12px;padding-bottom:8px}
  .hdr-right{margin-left:0}
}

function load(){
  try{
    const raw = localStorage.getItem("tn_demo");
    if(raw){ const d = JSON.parse(raw); Object.assign(S, d); }
  }catch(e){}
}
function save(){
  try{ localStorage.setItem("tn_demo", JSON.stringify({lang:S.lang,theme:S.theme,session:S.session,cart:S.cart,zip:S.zip})); }catch(e){}
}
function t(k){ return (I18N[S.lang] && I18N[S.lang][k]) || (I18N.es[k] || k); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function money(n){ return "$ " + n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function zone(zip){ return ZONES.find(function(z){return z.zip===zip;}) || null; }
function totalStock(){ return PROD.reduce(function(a,p){return a + p.stock.LEH + p.stock.FMY;},0); }
function stockOf(p){ return p.stock.LEH + p.stock.FMY; }
function nextCut(z){
  const now = new Date(); const mins = now.getHours()*60 + now.getMinutes();
  const cuts = (z ? z.cuts : ["07:00","13:00"]);
  for(var i=0;i<cuts.length;i++){
    const parts = cuts[i].split(":"); const m = (+parts[0])*60 + (+parts[1]);
    if(mins < m) return {label:cuts[i], today:true};
  }
  return {label:cuts[0], today:false};
}
function appLabel(a){
  const m = {es:{arrastre:"Arrastre",direccion:"Dirección",traccion:"Tracción","todo terreno":"Todo terreno"},
             en:{arrastre:"Trailer",direccion:"Steer",traccion:"Drive","todo terreno":"All-terrain"}};
  return m[S.lang][a] || a;
}
function stockPill(n, bo){
  if(n > 12) return '<span class="pill p-ok">'+n+' '+t("instock")+'</span>';
  if(n > 0)  return '<span class="pill p-warn">'+n+' · '+t("low")+'</span>';
  return '<span class="pill p-bad">'+t("backorder")+(bo?' '+bo.slice(5):'')+'</span>';
}
function priceCell(p){
  if(S.session) return '<td class="num"><b>'+money(p.net[S.session.tier])+'</b></td>';
  return '<td><button class="gatecell" data-go="#/cuenta">'+t("see_price")+'</button></td>';
}
function deliveryFor(p, z){
  const n = stockOf(p);
  if(n === 0) return {txt: (p.bo || "—"), cls:"p-bad"};
  if(!z) return {txt:"—", cls:""};
  const c = nextCut(z);
  return {txt: c.today ? (z.win==="mañana siguiente"||z.win==="next morning" ? (S.lang==="es"?"Mañana a. m.":"Tomorrow a.m.") : (S.lang==="es"?"Hoy · corte "+c.label:"Today · cut "+c.label)) : (S.lang==="es"?"Mañana · corte "+c.label:"Tomorrow · cut "+c.label), cls:""};
}
function cartCount(){ return S.cart.reduce(function(a,i){return a+i.qty;},0); }
function cartTotal(){
  return S.cart.reduce(function(a,i){
    const p = PROD.find(function(x){return x.sku===i.sku;});
    return a + (p ? p.net[S.session?S.session.tier:2] * i.qty : 0);
  },0);
}

    '</tbody></table></div>'+
    '<div class="notice" style="margin-top:18px">'+(S.lang==="es"
      ? "Meta interna: 95% de cumplimiento de ventana por zona. LaBelle, Clewiston y Punta Gorda están por debajo y se corrigen con una segunda salida a partir de octubre."
      : "Internal target: 95% window compliance per zone. LaBelle, Clewiston and Punta Gorda are below it and get a second run starting in October.")+'</div></div>';
}

/* ---------------- router ---------------- */
function render(){
  const hash = location.hash.replace(/^#/,"") || "/";
  const parts = hash.split("/").filter(Boolean);
  var body = "";
  if(parts.length===0) body = viewHome();
  else if(parts[0]==="stock") body = viewStock(parts[1]||"295-75R22-5");
  else if(parts[0]==="entrega") body = viewZona(parts[1]||null);
  else if(parts[0]==="cuenta") body = viewCuenta();
  else if(parts[0]==="portal") body = viewPortal();
  else if(parts[0]==="marcas") body = viewMarcas();
  else if(parts[0]==="programa") body = viewPrograma();
  else if(parts[0]==="aprende") body = viewAprende();
  else if(parts[0]==="desempeno") body = viewDesempeno();
  else body = viewHome();

  document.documentElement.lang = S.lang;
  if(S.theme) document.documentElement.setAttribute("data-theme", S.theme);
  else document.documentElement.removeAttribute("data-theme");

  document.getElementById("app").innerHTML =
    header("/"+(parts[0]||"")) + '<main>' + body + '</main>' + footer();
  wire();
  updateSchema(parts);
}
function toast(msg){
  var el = document.createElement("div");
  el.textContent = msg;
  el.setAttribute("role","status");
  el.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#0A0A0A;color:#fff;padding:12px 18px;border-radius:8px;font-family:var(--mono);font-size:.8rem;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:90vw;text-align:center";
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3200);
}
function wire(){
  const $ = function(id){ return document.getElementById(id); };
  const lang = $("btn-lang"); if(lang) lang.onclick = function(){ S.lang = S.lang==="es"?"en":"es"; save(); render(); };
  const th = $("btn-theme"); if(th) th.onclick = function(){ S.theme = S.theme==="dark"?"light":"dark"; save(); render(); };
  const lo = $("btn-logout"); if(lo) lo.onclick = function(){ S.session=null; S.cart=[]; save(); location.hash="#/"; render(); };
  const demo = $("btn-demo"); if(demo) demo.onclick = function(){
    S.session = {biz:"Ortega Truck Tire & Service", acct:"ORT-2041", tier:2, credit:11240, zip:"34142"};
    S.zip = "34142"; save(); render();
  };

  const sf = $("search"); if(sf) sf.onsubmit = function(e){
    e.preventDefault();
    S.zip = $("q-zip").value; S.filters.app = $("q-app").value; S.filters.brand=""; save();
    location.hash = "#/stock/" + $("q-size").value.replace(/[\/\.]/g,"-");
  };
  Array.prototype.forEach.call(document.querySelectorAll("[data-size]"), function(b){
    b.onclick = function(){ location.hash = "#/stock/" + b.dataset.size.replace(/[\/\.]/g,"-"); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-go]"), function(b){
    b.onclick = function(){ location.hash = b.dataset.go.replace(/^#/,"#"); };
  });
  const fs = $("f-size"); if(fs) fs.onchange = function(){ location.hash = "#/stock/"+fs.value.replace(/[\/\.]/g,"-"); };
  const fa = $("f-app"); if(fa) fa.onchange = function(){ S.filters.app = fa.value; render(); };
  const fb = $("f-brand"); if(fb) fb.onchange = function(){ S.filters.brand = fb.value; render(); };
  const fz = $("f-zip"); if(fz) fz.onchange = function(){ S.zip = fz.value; save(); render(); };
  const fst = $("f-stock"); if(fst) fst.onchange = function(){ S.filters.onlyStock = fst.checked; render(); };

  Array.prototype.forEach.call(document.querySelectorAll("[data-add]"), function(b){
    b.onclick = function(){
      const sku = b.dataset.add; const ex = S.cart.find(function(i){return i.sku===sku;});
      if(ex) ex.qty += 4; else S.cart.push({sku:sku, qty:4});
      save(); render();
      toast(S.lang==="es" ? "4 agregadas al carrito" : "4 added to cart");
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-del]"), function(b){
    b.onclick = function(){ S.cart = S.cart.filter(function(i){return i.sku!==b.dataset.del;}); save(); render(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-notify]"), function(b){
    b.onclick = function(){ toast(S.lang==="es" ? "Te avisamos por WhatsApp en cuanto entre a bodega." : "We'll message you on WhatsApp the moment it lands."); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-reorder]"), function(b){
    b.onclick = function(){
      const h = HIST.find(function(x){return x.po===b.dataset.reorder;});
      h.items.filter(function(it){return PROD.some(function(x){return x.sku===it[0];});}).forEach(function(it){
        const ex = S.cart.find(function(i){return i.sku===it[0];});
        if(ex) ex.qty += it[1]; else S.cart.push({sku:it[0], qty:it[1]});
      });
      save(); render();
      toast(S.lang==="es" ? "Pedido "+h.po+" copiado al carrito" : "Order "+h.po+" copied to cart");
    };
  });
  const place = $("btn-place"); if(place) place.onclick = function(){
    const z = zone(S.session ? S.session.zip : S.zip); const c = nextCut(z);
    S.cart = []; save(); render();
    toast(t("placed")+" "+c.label+".");
  };
  const rma = $("btn-rma"); if(rma) rma.onclick = function(){
    toast(S.lang==="es" ? "RMA-8842 generado. Imprime la etiqueta y pégala al casco." : "RMA-8842 generated. Print the label and tape it to the casing.");
  };

  const cert = $("s-cert"); if(cert){
    const mark = function(){ cert.classList.add("done"); cert.textContent = t("cert_ok"); };
    cert.onclick = mark;
    cert.onkeydown = function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); mark(); } };
  }
  const su = $("signup"); if(su) su.onsubmit = function(e){
    e.preventDefault();
    const ids = ["s-biz","s-ein","s-phone","s-addr","s-zip"];
    var ok = true;
    ids.forEach(function(id){
      const el = $(id); const wrap = el.parentNode;
      const old = wrap.querySelector(".err"); if(old) old.remove();
      if(!el.value.trim()){
        ok = false; el.style.borderColor = "var(--bad)";
        const p = document.createElement("p"); p.className="err"; p.textContent = t("req"); wrap.appendChild(p);
      } else { el.style.borderColor = ""; }
    });
    if(!$("s-cert").classList.contains("done")){
      ok = false; toast(t("fld_cert"));
    }
    if(!ok) return;
    const zp = $("s-zip").value.trim();
    if(!zone(zp)){ toast(t("bad_zip")); return; }
    S.session = {biz:$("s-biz").value.trim(), acct:"NEW-"+(1000+Math.floor(Math.random()*8999)), tier:2, credit:5000, zip:zp, provisional:true};
    S.zip = zp; save();
    location.hash = "#/portal"; render();
    toast(t("welcome")+" · "+S.session.acct);
  };
}

/* ---------------- datos estructurados ---------------- */
function updateSchema(parts){
  var node = document.getElementById("ld");
  if(!node){ node = document.createElement("script"); node.type="application/ld+json"; node.id="ld"; document.head.appendChild(node); }
  const org = {
    "@type":"Organization", "@id":"https://tirenexus.com/#org", name:"TireNexus",
    description:"Wholesale tire distributor serving dealers, fleets and independent shops across Southwest Florida and the I-75 corridor.",
    url:"https://tirenexus.com/", telephone:"+1-239-314-8100",
    sameAs:["https://www.linkedin.com/company/tirenexus","https://www.wikidata.org/wiki/Q000000"]
  };
  const graph = [org];
  if(parts[0]==="stock"){
    const size = SIZES.map(function(s){return s.size;}).find(function(s){return s.replace(/[\/\.]/g,"-")===parts[1];}) || "295/75R22.5";
    PROD.filter(function(p){return p.size===size;}).forEach(function(p){
      graph.push({"@type":"Product", sku:p.sku, mpn:p.sku, name:p.brand+" "+p.model+" "+p.size,
        brand:{"@type":"Brand",name:p.brand},
        offers:{"@type":"Offer", priceCurrency:"USD", availability: stockOf(p)>0 ? "https://schema.org/InStock" : "https://schema.org/BackOrder",
          seller:{"@id":"https://tirenexus.com/#org"}}});
    });
  }
  if(parts[0]==="entrega" && parts[1]){
    const z = zone(parts[1]);
    if(z) graph.push({"@type":"AutoPartsStore", name:"TireNexus · "+WH[z.wh].name,
      areaServed:{"@type":"PostalCodeSpecification", postalCode:z.zip, addressCountry:"US"},
      openingHoursSpecification:[{"@type":"OpeningHoursSpecification",dayOfWeek:["Monday","Tuesday","Wednesday","Thursday","Friday"],opens:"07:00",closes:"18:00"}]});
  }
  if(!parts.length){
    graph.push({"@type":"FAQPage", mainEntity: faqItems().map(function(f){
      return {"@type":"Question", name:f.q, acceptedAnswer:{"@type":"Answer", text:f.a.replace(/<[^>]+>/g,"")}};
    })});
  }
  node.textContent = JSON.stringify({"@context":"https://schema.org","@graph":graph});
}

/* ---------------- init ---------------- */
load();
window.addEventListener("hashchange", render);
render();
</script>
